[project]
name = "flowmotion"
version = "0.1.0"
description = "Conditional flow matching on AMASS with a horizon-stability evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["flow-matching", "motion-generation", "amass", "evaluation", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/oliverdippel/flowmotion-horizon"

[project.scripts]
flowmotion = "flowmotion.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage-badge>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmotion"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["flowmotion"]

[tool.coverage.report]
# cli.py is argparse wiring around already-tested library functions -- the test
# suite exercises those functions directly (see tests/test_smoke_e2e.py) rather
# than through argv, so it's excluded here rather than counted as untested logic.
omit = ["*/cli.py"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
