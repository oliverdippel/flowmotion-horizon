[project]
name = "flowmotion"
version = "0.1.0"
description = "Conditional flow matching on AMASS with a horizon-stability evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.scripts]
flowmotion = "flowmotion.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmotion"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
